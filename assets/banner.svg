<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Abhinav Kishore - Systems &amp; Backend Engineering</title>
  <desc id="bannerDesc">Terminal CLI and assembling ASCII name for Abhinav Kishore, systems and backend engineering.</desc>

  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#1b2a37" />
    </pattern>

    <!-- Terminal Gradient -->
    <linearGradient id="termGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a24" />
      <stop offset="100%" stop-color="#090f14" />
    </linearGradient>

    <!-- Accent Header Gradient -->
    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36d6c8" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>

    <!-- Subtle Amber Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0" />
    </radialGradient>

    <!-- Typing Clip Paths for CLI -->
    <clipPath id="typeLine1">
      <rect x="500" y="80" height="20" width="0">
        <animate attributeName="width" dur="10s" repeatCount="indefinite"
          keyTimes="0; 0.05; 0.12; 0.90; 1"
          values="0; 0; 240; 240; 0" />
      </rect>
    </clipPath>

    <clipPath id="typeResp1">
      <rect x="500" y="104" height="20" width="0">
        <animate attributeName="width" dur="10s" repeatCount="indefinite"
          keyTimes="0; 0.14; 0.22; 0.90; 1"
          values="0; 0; 340; 340; 0" />
      </rect>
    </clipPath>

    <clipPath id="typeLine2">
      <rect x="500" y="136" height="20" width="0">
        <animate attributeName="width" dur="10s" repeatCount="indefinite"
          keyTimes="0; 0.25; 0.35; 0.90; 1"
          values="0; 0; 260; 260; 0" />
      </rect>
    </clipPath>

    <clipPath id="typeResp2">
      <rect x="500" y="160" height="20" width="0">
        <animate attributeName="width" dur="10s" repeatCount="indefinite"
          keyTimes="0; 0.37; 0.50; 0.90; 1"
          values="0; 0; 370; 370; 0" />
      </rect>
    </clipPath>

    <clipPath id="typeLine3">
      <rect x="500" y="192" height="20" width="0">
        <animate attributeName="width" dur="10s" repeatCount="indefinite"
          keyTimes="0; 0.52; 0.62; 0.90; 1"
          values="0; 0; 220; 220; 0" />
      </rect>
    </clipPath>

    <clipPath id="typeResp3">
      <rect x="500" y="216" height="20" width="0">
        <animate attributeName="width" dur="10s" repeatCount="indefinite"
          keyTimes="0; 0.64; 0.74; 0.90; 1"
          values="0; 0; 380; 380; 0" />
      </rect>
    </clipPath>

    <clipPath id="typeLine4">
      <rect x="500" y="248" height="20" width="0">
        <animate attributeName="width" dur="10s" repeatCount="indefinite"
          keyTimes="0; 0.76; 0.86; 0.90; 1"
          values="0; 0; 380; 380; 0" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
    
    /* Blinking Cursor */
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: blink 1s infinite; }
  </style>

  <!-- Canvas Card Container -->
  <rect x="0.5" y="0.5" width="939" height="339" rx="16" fill="#0a1118" stroke="#1d2b38" stroke-width="1" />
  <rect x="0.5" y="0.5" width="939" height="339" rx="16" fill="url(#grid)" />
  <ellipse cx="230" cy="170" rx="220" ry="140" fill="url(#amberGlow)" />

  <!-- ==================== LEFT SIDE: CONVERGING ASCII NAME ==================== -->
  <g id="ascii-identity">
    <!-- Subtitle Flag -->
    <g class="mono" font-size="12" font-weight="600" fill="#36d6c8">
      <text x="42" y="58">// SYSTEM IDENTIFIER</text>
    </g>

    <!-- Converging ASCII Name: ABHINAV -->
    <!-- Line 1:  █████╗ ██████╗ ██╗  ██╗██╗███╗   ██╗ █████╗ ██╗   ██╗ -->
    <!-- Animate letters converging from multiple directions into position -->
    
    <!-- Letter A1: slides down from top -->
    <g transform="translate(0, 0)">
      <animateTransform attributeName="transform" type="translate" dur="1.2s"
        keyTimes="0; 0.8; 1" values="0,-60; 0,4; 0,0" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1" />
      <text x="42" y="98" class="mono" font-size="14.5" font-weight="700" fill="#58a6ff" letter-spacing="1">█████╗ </text>
      <text x="42" y="115" class="mono" font-size="14.5" font-weight="700" fill="#58a6ff" letter-spacing="1">██╔══██╗</text>
      <text x="42" y="132" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">███████║</text>
      <text x="42" y="149" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">██╔══██║</text>
      <text x="42" y="166" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">██║  ██║</text>
      <text x="42" y="183" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">╚═╝  ╚═╝</text>
    </g>

    <!-- Letter B: slides in from bottom -->
    <g transform="translate(0, 0)">
      <animateTransform attributeName="transform" type="translate" dur="1.3s"
        keyTimes="0; 0.8; 1" values="0,60; 0,-4; 0,0" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1" />
      <text x="106" y="98" class="mono" font-size="14.5" font-weight="700" fill="#58a6ff" letter-spacing="1">██████╗ </text>
      <text x="106" y="115" class="mono" font-size="14.5" font-weight="700" fill="#58a6ff" letter-spacing="1">██╔══██╗</text>
      <text x="106" y="132" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">██████╔╝</text>
      <text x="106" y="149" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">██╔══██╗</text>
      <text x="106" y="166" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">██████╔╝</text>
      <text x="106" y="183" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">╚═════╝ </text>
    </g>

    <!-- Letter H: slides in from left -->
    <g transform="translate(0, 0)">
      <animateTransform attributeName="transform" type="translate" dur="1.1s"
        keyTimes="0; 0.8; 1" values="-60,0; 4,0; 0,0" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1" />
      <text x="170" y="98" class="mono" font-size="14.5" font-weight="700" fill="#58a6ff" letter-spacing="1">██╗  ██╗</text>
      <text x="170" y="115" class="mono" font-size="14.5" font-weight="700" fill="#58a6ff" letter-spacing="1">██║  ██║</text>
      <text x="170" y="132" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">███████║</text>
      <text x="170" y="149" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">██╔══██║</text>
      <text x="170" y="166" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">██║  ██║</text>
      <text x="170" y="183" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">╚═╝  ╚═╝</text>
    </g>

    <!-- Letter I: slides in from top -->
    <g transform="translate(0, 0)">
      <animateTransform attributeName="transform" type="translate" dur="1.4s"
        keyTimes="0; 0.8; 1" values="0,-50; 0,3; 0,0" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1" />
      <text x="234" y="98" class="mono" font-size="14.5" font-weight="700" fill="#58a6ff" letter-spacing="1">██╗</text>
      <text x="234" y="115" class="mono" font-size="14.5" font-weight="700" fill="#58a6ff" letter-spacing="1">██║</text>
      <text x="234" y="132" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">██║</text>
      <text x="234" y="149" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">██║</text>
      <text x="234" y="166" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">██║</text>
      <text x="234" y="183" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">╚═╝</text>
    </g>

    <!-- Letter N: slides in from bottom -->
    <g transform="translate(0, 0)">
      <animateTransform attributeName="transform" type="translate" dur="1.2s"
        keyTimes="0; 0.8; 1" values="0,50; 0,-3; 0,0" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1" />
      <text x="264" y="98" class="mono" font-size="14.5" font-weight="700" fill="#58a6ff" letter-spacing="1">███╗   ██╗</text>
      <text x="264" y="115" class="mono" font-size="14.5" font-weight="700" fill="#58a6ff" letter-spacing="1">████╗  ██║</text>
      <text x="264" y="132" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">██╔██╗ ██║</text>
      <text x="264" y="149" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">██║╚██╗██║</text>
      <text x="264" y="166" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">██║ ╚████║</text>
      <text x="264" y="183" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">╚═╝  ╚═══╝</text>
    </g>

    <!-- Letter A2: slides in from right -->
    <g transform="translate(0, 0)">
      <animateTransform attributeName="transform" type="translate" dur="1.3s"
        keyTimes="0; 0.8; 1" values="50,0; -3,0; 0,0" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1" />
      <text x="350" y="98" class="mono" font-size="14.5" font-weight="700" fill="#58a6ff" letter-spacing="1">█████╗ </text>
      <text x="350" y="115" class="mono" font-size="14.5" font-weight="700" fill="#58a6ff" letter-spacing="1">██╔══██╗</text>
      <text x="350" y="132" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">███████║</text>
      <text x="350" y="149" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">██╔══██║</text>
      <text x="350" y="166" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">██║  ██║</text>
      <text x="350" y="183" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">╚═╝  ╚═╝</text>
    </g>

    <!-- Letter V: slides in from top -->
    <g transform="translate(0, 0)">
      <animateTransform attributeName="transform" type="translate" dur="1.5s"
        keyTimes="0; 0.8; 1" values="0,-60; 0,4; 0,0" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1" />
      <text x="414" y="98" class="mono" font-size="14.5" font-weight="700" fill="#58a6ff" letter-spacing="1">██╗   ██╗</text>
      <text x="414" y="115" class="mono" font-size="14.5" font-weight="700" fill="#58a6ff" letter-spacing="1">██║   ██║</text>
      <text x="414" y="132" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">██║   ██║</text>
      <text x="414" y="149" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">╚██╗ ██╔╝</text>
      <text x="414" y="166" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1"> ╚████╔╝ </text>
      <text x="414" y="183" class="mono" font-size="14.5" font-weight="700" fill="#36d6c8" letter-spacing="1">  ╚═══╝  </text>
    </g>

    <!-- Full English Name & Details underneath -->
    <text x="44" y="218" class="sans" font-size="22" font-weight="700" fill="#e6eef5" letter-spacing="-0.3">Abhinav Kishore</text>
    <rect x="44" y="228" width="180" height="3" rx="1.5" fill="url(#accentCyan)">
      <animate attributeName="width" values="180;240;180" dur="4s" repeatCount="indefinite" />
    </rect>

    <text x="44" y="258" class="mono" font-size="13" fill="#ffb347">> Backend &amp; Systems Engineering</text>
    <text x="44" y="280" class="sans" font-size="13" fill="#8396a6">CS&amp;E Diploma Student @ SLIET, India</text>
    <text x="44" y="302" class="mono" font-size="12" fill="#36d6c8">> Java 21 · C++ · TCP Protocols · Sockets</text>
  </g>

  <!-- ==================== RIGHT SIDE: TERMINAL CLI WINDOW ==================== -->
  <g id="terminal-cli" transform="translate(480, 24)">
    <!-- Terminal Outer Frame -->
    <rect x="0" y="0" width="426" height="292" rx="10" fill="url(#termGrad)" stroke="#223547" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="426" height="32" rx="10" fill="#14212e" />
    <path d="M0 24 h426 v8 h-426 z" fill="#14212e" />
    <line x1="0" y1="32" x2="426" y2="32" stroke="#223547" stroke-width="1" />

    <!-- Window Controls (Red, Yellow, Green Dots) -->
    <circle cx="18" cy="16" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="36" cy="16" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="54" cy="16" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

    <!-- Terminal Window Title -->
    <text x="213" y="20" class="mono" font-size="11.5" font-weight="600" fill="#8396a6" text-anchor="middle">abhinav@systems:~ (bash)</text>

    <!-- Terminal Content Area -->
    <g class="mono" font-size="12.5">
      <!-- Command 1 -->
      <g>
        <text x="20" y="58" fill="#36d6c8" font-weight="700">$ whoami</text>
        <text x="20" y="80" fill="#e6eef5" clip-path="url(#typeLine1)">abhinav kishore [systems dev]</text>
      </g>

      <!-- Command 2 -->
      <g>
        <text x="20" y="112" fill="#36d6c8" font-weight="700">$ cat discipline.txt</text>
        <text x="20" y="134" fill="#ffb347" clip-path="url(#typeResp1)">low-latency backend architecture</text>
        <text x="20" y="152" fill="#7f91a1" clip-path="url(#typeLine2)">data structures, memory &amp; protocols</text>
      </g>

      <!-- Command 3 -->
      <g>
        <text x="20" y="184" fill="#36d6c8" font-weight="700">$ cat core_stack.env</text>
        <text x="20" y="206" fill="#58a6ff" clip-path="url(#typeResp2)">JAVA_21=LTS · C++ · LINUX · TCP</text>
      </g>

      <!-- Command 4 -->
      <g>
        <text x="20" y="238" fill="#36d6c8" font-weight="700">$ ./get-status.sh</text>
        <text x="20" y="260" fill="#27c93f" font-weight="700" clip-path="url(#typeResp3)">ACTIVE: shipping MiniCache</text>
      </g>

      <!-- Blinking Terminal Cursor -->
      <rect x="238" y="248" width="7" height="14" fill="#36d6c8" class="cursor" />
    </g>
  </g>

  <!-- Bottom Accent Pulse Line -->
  <line x1="20" y1="330" x2="920" y2="330" stroke="#36d6c8" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 12" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="2.5s" repeatCount="indefinite" />
  </line>
</svg>
