<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Abhinav Kishore - Systems &amp; Backend Engineering</title>
  <desc id="bannerDesc">Terminal CLI and assembling ASCII name for Abhinav Kishore, systems and backend engineering.</desc>

  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#1b2a37" />
    </pattern>

    <!-- Terminal Gradient -->
    <linearGradient id="termGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a24" />
      <stop offset="100%" stop-color="#090f14" />
    </linearGradient>

    <!-- Accent Header Gradient -->
    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36d6c8" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="glow" cx="40%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#36d6c8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#36d6c8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }

    /* ASCII Letter Convergence Animations */
    @keyframes dropTop {
      0% { transform: translateY(-40px); opacity: 0; }
      70% { transform: translateY(3px); opacity: 1; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes riseBottom {
      0% { transform: translateY(40px); opacity: 0; }
      70% { transform: translateY(-3px); opacity: 1; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes slideLeft {
      0% { transform: translateX(-40px); opacity: 0; }
      70% { transform: translateX(3px); opacity: 1; }
      100% { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideRight {
      0% { transform: translateX(40px); opacity: 0; }
      70% { transform: translateX(-3px); opacity: 1; }
      100% { transform: translateX(0); opacity: 1; }
    }

    .letter-a1 { animation: dropTop 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .letter-b  { animation: riseBottom 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .letter-h  { animation: slideLeft 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .letter-i  { animation: dropTop 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .letter-n  { animation: riseBottom 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .letter-a2 { animation: slideRight 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .letter-v  { animation: dropTop 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* Terminal Typing Reveals */
    @keyframes typeOut {
      0%, 15% { opacity: 0; transform: translateX(-6px); }
      25%, 100% { opacity: 1; transform: translateX(0); }
    }
    .cmd1 { animation: typeOut 8s infinite; }
    .cmd2 { animation: typeOut 8s infinite 1.8s; }
    .cmd3 { animation: typeOut 8s infinite 3.6s; }
    .cmd4 { animation: typeOut 8s infinite 5.4s; }

    /* Blinking Cursor */
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: blink 0.9s infinite; }
  </style>

  <!-- Canvas Card Container -->
  <rect x="0.5" y="0.5" width="939" height="339" rx="14" fill="#0a1118" stroke="#1d2b38" stroke-width="1" />
  <rect x="0.5" y="0.5" width="939" height="339" rx="14" fill="url(#grid)" />
  <ellipse cx="240" cy="170" rx="230" ry="150" fill="url(#glow)" />

  <!-- ==================== LEFT SIDE: CONVERGING ASCII NAME ==================== -->
  <g id="ascii-identity">
    <!-- Subtitle Flag -->
    <text x="44" y="56" class="mono" font-size="11.5" font-weight="700" fill="#36d6c8" letter-spacing="1.5">// SYSTEM ARCHITECTURE &amp; PROTOCOLS</text>

    <!-- Converging ASCII Name: ABHINAV -->
    <!-- Letter A1 -->
    <g class="letter-a1">
      <text x="44" y="96" class="mono" font-size="14" font-weight="700" fill="#58a6ff" letter-spacing="0.5">█████╗ </text>
      <text x="44" y="113" class="mono" font-size="14" font-weight="700" fill="#58a6ff" letter-spacing="0.5">██╔══██╗</text>
      <text x="44" y="130" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">███████║</text>
      <text x="44" y="147" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">██╔══██║</text>
      <text x="44" y="164" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">██║  ██║</text>
      <text x="44" y="181" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">╚═╝  ╚═╝</text>
    </g>

    <!-- Letter B -->
    <g class="letter-b">
      <text x="106" y="96" class="mono" font-size="14" font-weight="700" fill="#58a6ff" letter-spacing="0.5">██████╗ </text>
      <text x="106" y="113" class="mono" font-size="14" font-weight="700" fill="#58a6ff" letter-spacing="0.5">██╔══██╗</text>
      <text x="106" y="130" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">██████╔╝</text>
      <text x="106" y="147" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">██╔══██╗</text>
      <text x="106" y="164" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">██████╔╝</text>
      <text x="106" y="181" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">╚═════╝ </text>
    </g>

    <!-- Letter H -->
    <g class="letter-h">
      <text x="168" y="96" class="mono" font-size="14" font-weight="700" fill="#58a6ff" letter-spacing="0.5">██╗  ██╗</text>
      <text x="168" y="113" class="mono" font-size="14" font-weight="700" fill="#58a6ff" letter-spacing="0.5">██║  ██║</text>
      <text x="168" y="130" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">███████║</text>
      <text x="168" y="147" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">██╔══██║</text>
      <text x="168" y="164" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">██║  ██║</text>
      <text x="168" y="181" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">╚═╝  ╚═╝</text>
    </g>

    <!-- Letter I -->
    <g class="letter-i">
      <text x="230" y="96" class="mono" font-size="14" font-weight="700" fill="#58a6ff" letter-spacing="0.5">██╗</text>
      <text x="230" y="113" class="mono" font-size="14" font-weight="700" fill="#58a6ff" letter-spacing="0.5">██║</text>
      <text x="230" y="130" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">██║</text>
      <text x="230" y="147" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">██║</text>
      <text x="230" y="164" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">██║</text>
      <text x="230" y="181" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">╚═╝</text>
    </g>

    <!-- Letter N -->
    <g class="letter-n">
      <text x="258" y="96" class="mono" font-size="14" font-weight="700" fill="#58a6ff" letter-spacing="0.5">███╗   ██╗</text>
      <text x="258" y="113" class="mono" font-size="14" font-weight="700" fill="#58a6ff" letter-spacing="0.5">████╗  ██║</text>
      <text x="258" y="130" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">██╔██╗ ██║</text>
      <text x="258" y="147" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">██║╚██╗██║</text>
      <text x="258" y="164" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">██║ ╚████║</text>
      <text x="258" y="181" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">╚═╝  ╚═══╝</text>
    </g>

    <!-- Letter A2 -->
    <g class="letter-a2">
      <text x="342" y="96" class="mono" font-size="14" font-weight="700" fill="#58a6ff" letter-spacing="0.5">█████╗ </text>
      <text x="342" y="113" class="mono" font-size="14" font-weight="700" fill="#58a6ff" letter-spacing="0.5">██╔══██╗</text>
      <text x="342" y="130" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">███████║</text>
      <text x="342" y="147" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">██╔══██║</text>
      <text x="342" y="164" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">██║  ██║</text>
      <text x="342" y="181" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">╚═╝  ╚═╝</text>
    </g>

    <!-- Letter V -->
    <g class="letter-v">
      <text x="404" y="96" class="mono" font-size="14" font-weight="700" fill="#58a6ff" letter-spacing="0.5">██╗   ██╗</text>
      <text x="404" y="113" class="mono" font-size="14" font-weight="700" fill="#58a6ff" letter-spacing="0.5">██║   ██║</text>
      <text x="404" y="130" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">██║   ██║</text>
      <text x="404" y="147" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">╚██╗ ██╔╝</text>
      <text x="404" y="164" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5"> ╚████╔╝ </text>
      <text x="404" y="181" class="mono" font-size="14" font-weight="700" fill="#36d6c8" letter-spacing="0.5">  ╚═══╝  </text>
    </g>

    <!-- Full English Identity Underneath -->
    <text x="44" y="216" class="sans" font-size="22" font-weight="700" fill="#f0f6fc">Abhinav Kishore</text>
    <rect x="44" y="226" width="200" height="3" rx="1.5" fill="url(#accentCyan)" />

    <text x="44" y="254" class="mono" font-size="13" fill="#ffb347">> Systems &amp; Backend Engineering</text>
    <text x="44" y="276" class="sans" font-size="13" fill="#8b949e">CS&amp;E Diploma Student @ SLIET, India</text>
    <text x="44" y="298" class="mono" font-size="12" fill="#36d6c8">> Java 21 · TCP Protocols · Sockets · Memory</text>
  </g>

  <!-- ==================== RIGHT SIDE: TERMINAL CLI WINDOW ==================== -->
  <g id="terminal-cli" transform="translate(480, 24)">
    <!-- Terminal Outer Frame -->
    <rect x="0" y="0" width="426" height="292" rx="10" fill="url(#termGrad)" stroke="#223547" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="426" height="32" rx="10" fill="#14212e" />
    <path d="M0 24 h426 v8 h-426 z" fill="#14212e" />
    <line x1="0" y1="32" x2="426" y2="32" stroke="#223547" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="18" cy="16" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="36" cy="16" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="54" cy="16" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

    <!-- Title -->
    <text x="213" y="20" class="mono" font-size="11.5" font-weight="600" fill="#8396a6" text-anchor="middle">abhinav@systems:~ (bash)</text>

    <!-- Terminal Content -->
    <g class="mono" font-size="12.5">
      <!-- Line 1 -->
      <g>
        <text x="18" y="58" fill="#36d6c8" font-weight="700">$ whoami</text>
        <g class="cmd1">
          <text x="18" y="78" fill="#f0f6fc">abhinav kishore [systems dev]</text>
        </g>
      </g>

      <!-- Line 2 -->
      <g>
        <text x="18" y="110" fill="#36d6c8" font-weight="700">$ cat focus.txt</text>
        <g class="cmd2">
          <text x="18" y="130" fill="#ffb347">low-latency backend architecture</text>
          <text x="18" y="148" fill="#8b949e">data structures, memory &amp; wire protocols</text>
        </g>
      </g>

      <!-- Line 3 -->
      <g>
        <text x="18" y="180" fill="#36d6c8" font-weight="700">$ cat stack.env</text>
        <g class="cmd3">
          <text x="18" y="200" fill="#58a6ff">JAVA_21 · C++ · LINUX · TCP_SOCKETS</text>
        </g>
      </g>

      <!-- Line 4 -->
      <g>
        <text x="18" y="232" fill="#36d6c8" font-weight="700">$ ./status.sh</text>
        <g class="cmd4">
          <text x="18" y="252" fill="#27c93f" font-weight="700">ACTIVE: shipping MiniCache</text>
          <!-- Blinking Terminal Cursor -->
          <rect x="228" y="240" width="7" height="14" fill="#36d6c8" class="cursor" />
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Pulse Line -->
  <line x1="20" y1="330" x2="920" y2="330" stroke="#36d6c8" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 12" stroke-linecap="round" />
</svg>
